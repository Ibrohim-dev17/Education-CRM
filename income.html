<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daromad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #fff; color: #111; display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }
        .content { flex: 1; overflow-y: auto; padding: 16px 20px 90px 20px; display: flex; flex-direction: column; gap: 16px; }
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #fff; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #F0F2F5; }
        .app-header h1 { font-size: 17px; font-weight: 600; color: #111; }
        .back-btn, .add-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; color: #111; }
        .add-btn { background-color: #0066FF; color: white; width: 32px; height: 32px; border-radius: 50%; justify-content: center; box-shadow: 0 4px 10px rgba(0,102,255,0.3); }
        .month-filter { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 14px; font-size: 14px; font-weight: 600; }
        .month-filter select { border: none; background: transparent; font-size: 14px; font-weight: 600; color: #111; outline: none; cursor: pointer; }
        .total-card { background-color: #E8F8F0; border-radius: 16px; padding: 18px 20px; border: 1px solid #D4F3E2; }
        .total-card span { font-size: 13px; color: #27ae60; font-weight: 600; }
        .total-card .amount { font-size: 24px; font-weight: 700; color: #27ae60; margin-top: 4px; }
        .income-list { display: flex; flex-direction: column; gap: 12px; }
        .income-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; }
        .income-left { display: flex; align-items: center; gap: 12px; }
        .icon-box { width: 36px; height: 36px; background-color: #E8F8F0; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #27ae60; flex-shrink: 0; }
        .income-info h4 { font-size: 13px; font-weight: 600; color: #111; margin-bottom: 2px; }
        .income-info p { font-size: 11px; color: #6B7280; }
        .income-sum { font-size: 14px; font-weight: 700; color: #27ae60; }
        .today-tushum { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; background-color: #E8F8F0; border: 1px solid #D4F3E2; border-radius: 16px; }
        .today-tushum span:first-child { font-size: 14px; font-weight: 600; color: #27ae60; }
        .today-amount { font-size: 16px; font-weight: 700; color: #27ae60; }
        .empty-state { text-align: center; color: #9CA3AF; padding: 20px 0; font-size: 13px; font-style: italic; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; height: 75px; background: #ffffff; border-top: 1px solid #F0F2F5; display: flex; justify-content: space-around; align-items: center; padding: 0 10px 10px 10px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9CA3AF; font-size: 10px; gap: 4px; flex: 1; }
        .nav-item.active { color: #0066FF; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-center-btn-wrapper { flex: 1; display: flex; justify-content: center; position: relative; top: -14px; }
        .nav-center-btn { width: 48px; height: 48px; background-color: #0066FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 12px rgba(0,102,255,0.4); cursor: pointer; color: #fff; text-decoration: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; z-index: 200; }
        .modal-content { background: #fff; width: 100%; max-width: 480px; padding: 24px; border-radius: 24px 24px 0 0; }
        .modal-content h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #111; }
        .form-group { margin-bottom: 14px; }
        .form-group label { font-size: 12px; color: #4B5563; display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 12px; font-size: 14px; background: #F9FAFB; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit { flex: 1; background: #0066FF; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-cancel { flex: 1; background: #F3F4F6; color: #4B5563; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-header">
        <button class="back-btn" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg></button>
        <h1>Daromad</h1>
        <button class="add-btn" id="openModalTopBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    </div>
    <div class="content">
        <div class="month-filter">
            <span>Joriy davr</span>
            <select id="monthSelector">
                <option value="all">Barcha davrlar</option>
            </select>
        </div>
        <div class="total-card">
            <span>Jami daromad</span>
            <div class="amount" id="totalIncomeSum">0 so'm</div>
        </div>
        <div class="income-list" id="incomeListContainer">
            <div class="empty-state">Hozircha daromadlar kiritilmagan</div>
        </div>
        <div class="today-tushum">
            <span>Bugungi tushum</span>
            <span class="today-amount" id="todayIncomeSum">0 so'm</span>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg><span>Bosh sahifa</span></a>
        <a href="students.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>O'quvchilar</span></a>
        <div class="nav-center-btn-wrapper"><a href="add_student.html" class="nav-center-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></a></div>
        <a href="payments.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg><span>To'lovlar</span></a>
        <a href="menu.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Menyu</span></a>
    </div>

    <div class="modal" id="incomeModal">
        <div class="modal-content">
            <h3>Yangi Daromad Qo'shish</h3>
            <form id="incomeForm">
                <div class="form-group">
                    <label>Sarlavha / Manba</label>
                    <input type="text" id="incomeTitle" required placeholder="Masalan: To'lov - Akmalov Azizbek">
                </div>
                <div class="form-group">
                    <label>Summa (so'm)</label>
                    <input type="number" id="incomeAmount" required placeholder="600000">
                </div>
                <div class="form-group">
                    <label>Sana</label>
                    <input type="date" id="incomeDate" required>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-cancel" id="closeModalBtn">Bekor qilish</button>
                    <button type="submit" class="btn-submit">Qo'shish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const incomeListContainer = document.getElementById('incomeListContainer');
            const totalIncomeSum = document.getElementById('totalIncomeSum');
            const todayIncomeSum = document.getElementById('todayIncomeSum');
            const incomeModal = document.getElementById('incomeModal');
            const openModalTopBtn = document.getElementById('openModalTopBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const incomeForm = document.getElementById('incomeForm');
            const incomeDateInput = document.getElementById('incomeDate');

            const todayStr = new Date().toISOString().split('T')[0];
            incomeDateInput.value = todayStr;

            let incomes = JSON.parse(localStorage.getItem('payments')) || [];

            function renderIncomes() {
                incomeListContainer.innerHTML = '';
                let total = 0;
                let todayTotal = 0;

                if (incomes.length === 0) {
                    incomeListContainer.innerHTML = `<div class="empty-state">Hozircha daromadlar kiritilmagan</div>`;
                    totalIncomeSum.textContent = '0 so\'m';
                    todayIncomeSum.textContent = '0 so\'m';
                    return;
                }

                incomes.forEach(item => {
                    const amountNum = Number(item.amount) || 0;
                    total += amountNum;

                    if (item.date === todayStr) {
                        todayTotal += amountNum;
                    }

                    const card = document.createElement('div');
                    card.className = 'income-item';
                    card.innerHTML = `
                        <div class="income-left">
                            <div class="icon-box">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                            <div class="income-info">
                                <h4>${item.name || item.title || 'To\'lov'}</h4>
                                <p>${item.date || ''}</p>
                            </div>
                        </div>
                        <div class="income-sum">+${amountNum.toLocaleString()} so'm</div>
                    `;
                    incomeListContainer.appendChild(card);
                });

                totalIncomeSum.textContent = total.toLocaleString() + ' so\'m';
                todayIncomeSum.textContent = todayTotal.toLocaleString() + ' so\'m';
            }

            openModalTopBtn.addEventListener('click', () => { incomeModal.style.display = 'flex'; });
            closeModalBtn.addEventListener('click', () => { incomeModal.style.display = 'none'; });

            incomeForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('incomeTitle').value.trim();
                const amount = document.getElementById('incomeAmount').value;
                const date = document.getElementById('incomeDate').value;

                if (!title || !amount || !date) return;

                incomes.unshift({ name: title, amount, date });
                localStorage.setItem('payments', JSON.stringify(incomes));

                incomeForm.reset();
                incomeDateInput.value = todayStr;
                incomeModal.style.display = 'none';
                renderIncomes();
            });

            renderIncomes();
        });
    </script>
</body>
</html>
