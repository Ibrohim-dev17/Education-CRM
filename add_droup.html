<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guruh qo'shish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f8f9fc; color: #1e293b; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; position: relative; padding-bottom: 50px; }
        
        .header { display: flex; align-items: center; padding: 20px; background: #fff; border-bottom: 1px solid #e2e8f0; gap: 15px; }
        .header a { color: #0f172a; font-size: 18px; text-decoration: none; }
        .header h1 { font-size: 18px; font-weight: 700; color: #0f172a; }

        .form-container { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 500; color: #475569; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; color: #0f172a; }
        .form-group input:focus, .form-group select:focus { border-color: #2563eb; }

        .save-btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <a href="groups.html"><i class="fa-solid fa-arrow-left"></i></a>
        <h1>Yangi guruh qo'shish</h1>
    </div>

    <form class="form-container" onsubmit="saveGroup(event)">
        <div class="form-group">
            <label>Guruh nomi *</label>
            <input type="text" id="groupName" placeholder="Masalan: Frontend N1" required>
        </div>

        <div class="form-group">
            <label>Fan / Yo'nalish *</label>
            <input type="text" id="groupSubject" placeholder="Masalan: Ingliz tili / Dasturlash" required>
        </div>

        <div class="form-group">
            <label>O'qituvchi *</label>
            <input type="text" id="groupTeacher" placeholder="O'qituvchi F.I.Sh." required>
        </div>

        <div class="form-group">
            <label>Oylik narxi (so'm)</label>
            <input type="text" id="groupPrice" placeholder="Masalan: 300000">
        </div>

        <button type="submit" class="save-btn">Saqlash</button>
    </form>
</div>

<script>
    function saveGroup(e) {
        e.preventDefault();
        
        const name = document.getElementById('groupName').value;
        const subject = document.getElementById('groupSubject').value;
        const teacher = document.getElementById('groupTeacher').value;
        const price = document.getElementById('groupPrice').value;

        const newGroup = {
            name: name,
            subject: subject,
            teacher: teacher,
            price: price
        };

        let groups = JSON.parse(localStorage.getItem('center_groups')) || [];
        groups.push(newGroup);
        localStorage.setItem('center_groups', JSON.stringify(groups));

        alert("Guruh muvaffaqiyatli qo'shildi!");
        window.location.href = "groups.html";
    }
</script>
</body>
</html>
