<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moliya statistikasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #fff; color: #111; display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }
        .content { flex: 1; overflow-y: auto; padding: 16px 20px 90px 20px; display: flex; flex-direction: column; gap: 16px; }
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #fff; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #F0F2F5; }
        .app-header h1 { font-size: 17px; font-weight: 600; color: #111; }
        .action-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; color: #111; }
        .tabs { display: flex; background: #F3F4F6; border-radius: 12px; padding: 3px; gap: 4px; }
        .tab { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 9px; cursor: pointer; color: #6B7280; border: none; background: transparent; }
        .tab.active { background: #fff; color: #111; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .month-box { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #ffffff; border: 1px solid #E5E7EB; border-radius: 12px; font-size: 13px; font-weight: 600; }
        .stat-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
        .stat-card h3 { font-size: 22px; font-weight: 700; color: #111; }
        .stat-card p { font-size: 12px; color: #6B7280; }
        .section-box { background: #fff; border: 1px solid #E5E7EB; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .section-box h4 { font-size: 14px; font-weight: 600; color: #111; }
        .empty-text { font-size: 12px; color: #9CA3AF; text-align: center; padding: 10px 0; font-style: italic; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; height: 75px; background: #ffffff; border-top: 1px solid #F0F2F5; display: flex; justify-content: space-around; align-items: center; padding: 0 10px 10px 10px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9CA3AF; font-size: 10px; gap: 4px; flex: 1; }
        .nav-item.active { color: #0066FF; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-center-btn-wrapper { flex: 1; display: flex; justify-content: center; position: relative; top: -14px; }
        .nav-center-btn { width: 48px; height: 48px; background-color: #0066FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 12px rgba(0,102,255,0.4); cursor: pointer; color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>Moliya statistikasi</h1>
        <button class="action-btn" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg></button>
    </div>
    <div class="content">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('income', this)">Daromad</button>
            <button class="tab" onclick="switchTab('expense', this)">Xarajat</button>
            <button class="tab" onclick="switchTab('profit', this)">Sof foyda</button>
        </div>
        <div class="month-box">
            <span id="currentPeriodLabel">Jami ko'rsatkich</span>
        </div>
        <div class="stat-card">
            <p id="statTitle">Jami Daromad</p>
            <h3 id="statValue">0 so'm</h3>
        </div>
        <div class="section-box">
            <h4>Tafsilotlar</h4>
            <div id="detailsContainer" class="empty-text">Hozircha tranzaksiyalar mavjud emas</div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg><span>Bosh sahifa</span></a>
        <a href="students.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>O'quvchilar</span></a>
        <div class="nav-center-btn-wrapper"><a href="add_student.html" class="nav-center-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></a></div>
        <a href="payments.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg><span>To'lovlar</span></a>
        <a href="menu.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Menyu</span></a>
    </div>

    <script>
        let currentMode = 'income';

        function loadStats() {
            const payments = JSON.parse(localStorage.getItem('payments')) || [];
            const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
            
            let totalIncome = 0;
            payments.forEach(p => totalIncome += (Number(p.amount) || 0));

            let totalExpense = 0;
            expenses.forEach(e => totalExpense += (Number(e.amount) || 0));

            let netProfit = totalIncome - totalExpense;

            const statTitle = document.getElementById('statTitle');
            const statValue = document.getElementById('statValue');
            const detailsContainer = document.getElementById('detailsContainer');

            if (currentMode === 'income') {
                statTitle.innerText = "Jami Daromad";
                statValue.innerText = totalIncome.toLocaleString() + " so'm";
                statValue.style.color = "#10B981";
                
                if (payments.length === 0) {
                    detailsContainer.innerHTML = `<div class="empty-text">Hozircha daromadlar mavjud emas</div>`;
                } else {
                    detailsContainer.innerHTML = '';
                    payments.forEach(p => {
                        detailsContainer.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid #F0F2F5;"><span>${p.name || 'To\'lov'} (${p.date || ''})</span><b style="color:#10B981;">+${(Number(p.amount)||0).toLocaleString()} so'm</b></div>`;
                    });
                }
            } else if (currentMode === 'expense') {
                statTitle.innerText = "Jami Xarajat";
                statValue.innerText = totalExpense.toLocaleString() + " so'm";
                statValue.style.color = "#EF4444";

                if (expenses.length === 0) {
                    detailsContainer.innerHTML = `<div class="empty-text">Hozircha xarajatlar mavjud emas</div>`;
                } else {
                    detailsContainer.innerHTML = '';
                    expenses.forEach(e => {
                        detailsContainer.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid #F0F2F5;"><span>${e.title || 'Xarajat'} (${e.date || ''})</span><b style="color:#EF4444;">-${(Number(e.amount)||0).toLocaleString()} so'm</b></div>`;
                    });
                }
            } else {
                statTitle.innerText = "Sof Foyda";
                statValue.innerText = netProfit.toLocaleString() + " so'm";
                statValue.style.color = netProfit >= 0 ? "#0066FF" : "#EF4444";
                detailsContainer.innerHTML = `<div style="font-size:13px; color:#4B5563; text-align:center; padding:10px 0;">Sof foyda = Jami daromad (${totalIncome.toLocaleString()} so'm) - Jami xarajat (${totalExpense.toLocaleString()} so'm)</div>`;
            }
        }

        function switchTab(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            loadStats();
        }

        window.onload = loadStats;
    </script>
</body>
</html>
